name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: BackendEmma
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, zip, gd
          coverage: none
      - name: Configuración de la base (antes de composer: su post-install limpia la caché)
        run: |
          cp app/config/parameters.yml.dist app/config/parameters.yml
          sed -i 's/database_password: ~/database_password: root/' app/config/parameters.yml
      - name: Dependencias
        run: composer install --no-interaction --no-progress
      - name: Pruebas
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AccesoriosEmma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AccesoriosEmma/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npx ng test --watch=false
      - name: Build de producción
        run: npx ng build
