# ---------------- Autenticación ----------------
login:
    path: /api/login
    controller: AppBundle\Controller\AuthController::login
    methods: [POST]
me:
    path: /api/me
    controller: AppBundle\Controller\AuthController::me
    methods: [GET]
me_password:
    path: /api/me/password
    controller: AppBundle\Controller\AuthController::cambiarPassword
    methods: [POST]

dashboard:
    path: /api/dashboard
    controller: AppBundle\Controller\DashboardController::resumen
    methods: [GET]
dashboard_graficos:
    path: /api/dashboard/graficos
    controller: AppBundle\Controller\DashboardController::graficos
    methods: [GET]

# ---------------- Catálogos (CRUD) ----------------
productos:
    resource: routing/productos.yml
insumos:
    resource: routing/insumos.yml
clientes:
    resource: routing/clientes.yml
proveedores:
    resource: routing/proveedores.yml
ciudades:
    resource: routing/ciudades.yml

provincias:
    path: /api/provincias
    controller: AppBundle\Controller\CiudadController::provincias
    methods: [GET]

# ---------------- Operaciones ----------------
compras_listar:
    path: /api/compras
    controller: AppBundle\Controller\CompraController::listar
    methods: [GET]
compras_crear:
    path: /api/compras
    controller: AppBundle\Controller\CompraController::crear
    methods: [POST]
compras_anular:
    path: /api/compras/{id}/anular
    controller: AppBundle\Controller\CompraController::anular
    methods: [POST]
    requirements: { id: '\d+' }

canjes_listar:
    path: /api/canjes
    controller: AppBundle\Controller\CanjeController::listar
    methods: [GET]
canjes_crear:
    path: /api/canjes
    controller: AppBundle\Controller\CanjeController::crear
    methods: [POST]
pases_venta_listar:
    path: /api/pases-venta
    controller: AppBundle\Controller\PaseVentaController::listar
    methods: [GET]
pases_venta_crear:
    path: /api/pases-venta
    controller: AppBundle\Controller\PaseVentaController::crear
    methods: [POST]
pases_venta_simular:
    path: /api/pases-venta/simular
    controller: AppBundle\Controller\PaseVentaController::simular
    methods: [POST]
pases_venta_ver:
    path: /api/pases-venta/{id}
    controller: AppBundle\Controller\PaseVentaController::ver
    methods: [GET]
    requirements: { id: '\d+' }
pases_venta_anular:
    path: /api/pases-venta/{id}/anular
    controller: AppBundle\Controller\PaseVentaController::anular
    methods: [POST]
    requirements: { id: '\d+' }
canjes_anular:
    path: /api/canjes/{id}/anular
    controller: AppBundle\Controller\CanjeController::anular
    methods: [POST]
    requirements: { id: '\d+' }

ventas_listar:
    path: /api/ventas
    controller: AppBundle\Controller\VentaController::listar
    methods: [GET]
ventas_crear:
    path: /api/ventas
    controller: AppBundle\Controller\VentaController::crear
    methods: [POST]
ventas_anular:
    path: /api/ventas/{id}/anular
    controller: AppBundle\Controller\VentaController::anular
    methods: [POST]
    requirements: { id: '\d+' }
ventas_ver:
    path: /api/ventas/{id}
    controller: AppBundle\Controller\VentaController::ver
    methods: [GET]
    requirements: { id: '\d+' }

# ---------------- Reportes ----------------
reportes_ver:
    path: /api/reportes/{tipo}
    controller: AppBundle\Controller\ReporteController::ver
    methods: [GET]
    requirements: { tipo: 'ventas|compras|canjes|pases' }
reportes_excel:
    path: /api/reportes/{tipo}/excel
    controller: AppBundle\Controller\ReporteController::excel
    methods: [GET]
    requirements: { tipo: 'ventas|compras|canjes|pases' }
usuarios_listar:
    path: /api/usuarios
    controller: AppBundle\Controller\ReporteController::usuarios
    methods: [GET]

# ---------------- Configuración (solo administradores, ver security.yml) ----------------
admin_usuarios_listar:
    path: /api/admin/usuarios
    controller: AppBundle\Controller\AdminUsuarioController::listar
    methods: [GET]
admin_usuarios_crear:
    path: /api/admin/usuarios
    controller: AppBundle\Controller\AdminUsuarioController::crear
    methods: [POST]
admin_roles:
    path: /api/admin/roles
    controller: AppBundle\Controller\AdminUsuarioController::roles
    methods: [GET]
admin_usuarios_editar:
    path: /api/admin/usuarios/{id}
    controller: AppBundle\Controller\AdminUsuarioController::editar
    methods: [PUT]
    requirements: { id: '\d+' }
admin_usuarios_estado:
    path: /api/admin/usuarios/{id}/estado
    controller: AppBundle\Controller\AdminUsuarioController::estado
    methods: [PUT]
    requirements: { id: '\d+' }
admin_usuarios_password:
    path: /api/admin/usuarios/{id}/password
    controller: AppBundle\Controller\AdminUsuarioController::password
    methods: [PUT]
    requirements: { id: '\d+' }
admin_auditoria:
    path: /api/admin/auditoria
    controller: AppBundle\Controller\AuditoriaController::listar
    methods: [GET]
admin_usuarios_borrar:
    path: /api/admin/usuarios/{id}
    controller: AppBundle\Controller\AdminUsuarioController::borrar
    methods: [DELETE]
    requirements: { id: '\d+' }
