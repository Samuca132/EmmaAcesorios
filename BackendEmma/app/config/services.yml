services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $jwtSecret: '%env(JWT_SECRET)%'
            $jwtTtl: '%env(int:JWT_TTL)%'
            $corsAllowOrigin: '%env(CORS_ALLOW_ORIGIN)%'
            $anulacionPermitida: '%env(ANULACION_PERMITIDA)%'

    AppBundle\:
        resource: '../../src/AppBundle/*'
        exclude: '../../src/AppBundle/{AppBundle.php,Entity,Command/Passwords.php,Repository/IncluyeBorrados.php}'

    AppBundle\Controller\:
        resource: '../../src/AppBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    # Historial de cambios (tabla auditoria)
    AppBundle\Auditoria\AuditoriaSubscriber:
        tags: [doctrine.event_subscriber]
