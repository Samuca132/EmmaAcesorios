<div class="page">
  <app-page-header titulo="Productos" subtitulo="Catálogo de productos terminados y su stock.">
    <button mat-flat-button (click)="nuevo()"><mat-icon>add</mat-icon>Nuevo producto</button>
  </app-page-header>
  <app-data-table [columnas]="columnas" [datos]="visibles()" [cargando]="cargando()"
                  (editar)="editar($event)" (borrar)="borrar($event)"
                  [acciones]="acciones()" (accion)="accion($event)">
    <mat-checkbox [checked]="soloBajoMinimo()" (change)="soloBajoMinimo.set($event.checked)">
      Solo bajo mínimo ({{ cantidadBajoMinimo() }})
    </mat-checkbox>
  </app-data-table>
</div>
